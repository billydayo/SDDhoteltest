# Alembic configuration.
#
# NOTE: This file MUST stay ASCII-only. Alembic reads it with Python's
# configparser, which decodes using the system locale encoding (cp950 on
# Traditional Chinese Windows), not UTF-8. Non-ASCII comments here raise
# UnicodeDecodeError before any migration can run. The Chinese explanations
# for this project live in alembic/env.py, which Python reads as UTF-8.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is deliberately NOT set here.
#
# The connection string is built by alembic/env.py from pydantic-settings
# (the owner-role DSN). Writing a DSN containing the database password into
# this version-controlled file would commit database credentials to source
# control, which the constitution forbids (FR-085, SC-022).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

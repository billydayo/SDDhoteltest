<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunny — 單元測試</title>

  <!--
    刻意不載入 src/config.js：沒有憑證即為示範模式，測試因此不會連到任何
    資料庫，也不會動到線上資料。
  -->
  <style>
    body {
      margin: 0 auto; padding: 2rem 1.5rem; max-width: 60rem;
      font: 16px/1.7 system-ui, "Noto Sans TC", sans-serif;
      background: #FAF8F4; color: #1B2A24;
    }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    h2 { font-size: 1rem; margin: 2rem 0 .5rem; padding-bottom: .35rem;
         border-bottom: 1px solid rgba(27,42,36,.12); }
    .lede { color: #5A6B63; margin: 0 0 1rem; font-size: .9rem; }
    .case { font-size: .9rem; padding: .2rem 0; }
    .case.fail { color: #A8322D; }
    .summary {
      position: sticky; top: 0; z-index: 1;
      margin: 0 0 1rem; padding: .75rem 1rem; border-radius: 8px;
      font-weight: 600;
    }
    .summary.pass { background: #E3EFE7; color: #1F5134; }
    .summary.fail { background: #F7E2E1; color: #A8322D; }
  </style>
</head>
<body>
  <h1>單元測試</h1>
  <p class="lede">
    純函式與判定規則。無依賴、無建置步驟——直接開這一頁就跑（憲章「關於自動化測試」）。
    版面與視覺仍由 <code>checklists/browser-acceptance.md</code> 人工驗收。
  </p>

  <div id="out"></div>

  <script type="module">
    import { run } from './runner.js';
    import './unit.js';                 // 匯入即註冊所有 describe()

    run(document.getElementById('out'));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunny 訂房平台</title>
  <meta name="description" content="Sunny 訂房平台——展示用的單一飯店線上訂房原型。">

  <!-- 品牌圖示（logo 的建築＋床標誌，去背 PNG）同時作為分頁圖示與行動裝置捷徑圖示 -->
  <link rel="icon" href="assets/logo-mark.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo-mark.png">

  <!--
    Playfair Display：專案唯一的外部字型依賴，只用於拉丁字標題與數字。
    中文會逐字退回系統明體。font-display: swap 讓載入失敗或離線時
    文字不會消失，只是換成系統襯線體（憲章「字型」條）。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap">

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/admin.css">
  <link rel="stylesheet" href="styles/responsive.css">

  <!--
    設定檔必須在應用程式模組之前以一般 <script> 載入，
    這樣 window.__SUNNY_CONFIG__ 在 main.js 執行時就已就緒。
    此檔隨專案提供且預設留空，因此不會產生 404。
  -->
  <script src="src/config.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>

  <div id="mode-banner" role="status" aria-live="polite"></div>

  <header id="site-header" class="site-header"></header>

  <main id="main" class="site-main" tabindex="-1">
    <p class="loading-state">載入中…</p>
  </main>

  <footer class="site-footer">
    <img class="site-footer__logo" src="assets/logo.png" alt="Sunny" width="500" height="368">

    <nav aria-label="頁尾導覽">
      <a href="#/terms">服務條款與隱私聲明</a>
    </nav>
    <p class="site-footer__note">
      本站為展示用專案，不提供真實住宿服務，付款與退款均為模擬，不會產生任何實際交易。
    </p>
  </footer>

  <div id="modal-root"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>

# socket 所在的目錄。裝到 /etc/tmpfiles.d/sunny.conf（見 docs/deploy.md）。
#
# ## 為什麼不用 .service 的 RuntimeDirectory=
#
# 那個指令會在服務停止時**把目錄刪掉**，下次啟動再建一個新的。但這個目錄被
# bind mount 進 caddy 容器，而 bind mount 綁的是 inode 不是路徑——目錄一旦被
# 重建，容器那一側仍指著已經被刪除的舊 inode：掛載看起來還在，裡面卻永遠是空的,
# 於是 /_deploy 開始回 502，而 `ls /run/sunny` 在宿主機上看起來完全正常。
#
# 交給 tmpfiles 的話目錄在開機時就建好、之後一直在，服務怎麼重啟都不動它。
#
# /run 是 tmpfs，重開機就沒了——這一行正是每次開機把它補回來的東西。
d /run/sunny 0755 root root -
